title: "Chess and Stuff with Maria"
author: "Maria Ciocan"
description: "I love chess and books, among other things. So I'll share reviews and bits I find interesting." # This will show up in places like twitter, linkedin, etc, if you share your sites url as a post.

# Email / Social media user names used by the minima theme:
# All of these are optional and can be removed or commented out
# email: "example@mail.com"
# twitter_username: "twitteruser"
# github_username: "githubuser"
# linkedin_username: "linkedinuser"
#facebook_username: username
#flickr_username: username
#instagram_username: username
#pinterest_username: username
youtube_username: "@Maria-qdreamer"
#googleplus_username: +username

# Default settings for chess replay boards. See setup.md before changing them.
# Restart the local Jekyll preview after editing this file.
chess_replay:
  autoplay: "off"
  speed: 1200
  loop: false
  loop_delay: 2000
  orientation: "white"
  theme: "default"
  arrow_width: 1
  pieces_file: "pieces/standard.svg"
  pieces_credit: "Cburnett"
  pieces_credit_url: "https://commons.wikimedia.org/wiki/Category:SVG_chess_pieces/Standard"
  pieces_license: "CC BY-SA 3.0"
  pieces_license_url: "https://creativecommons.org/licenses/by-sa/3.0/"

#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################
theme: "minima"

rss: rss

kramdown:
  syntax_highlighter_opts:
    disable: true
    
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Jekyll's default exclusions are listed because this setting replaces them.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - setup.md

titles_from_headings:
  strip_title: true
  collections: true

defaults:
  - scope:
      path: ""
      type: post
    values:
      tags: Other
